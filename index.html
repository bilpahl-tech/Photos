<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos by W.A.Pahl</title>
  <meta name="description" content="A collection of photos by W.A.Pahl.">
  <link rel="icon" href="favicon.ico">
  <style>
    :root { --page-padding: 1rem; --max-width: 900px; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      padding: var(--page-padding);
      margin: 0;
      color: #111;
      background: #fff;
    }
    .container { max-width: var(--max-width); margin: 0 auto; }
    header { text-align: center; margin-bottom: 1rem; }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
    }
    .credit { font-size: 0.95rem; color: #444; text-align: center; margin: 0 0 0.75rem 0; }
    main { display: block; }
    .photo {
      margin: 0 0 1rem 0;
    }
    .heading-img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
    }
    .caption { font-size: 0.9rem; color: #444; text-align: center; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <div class="container">
    <p class="credit">These photos may be reproduced with attribution to William Adan Pahl. Taken summer 2026.</p>
    <header>
      <h1>Photos by W.A.Pahl</h1>
      <p style="font-size: 1.1rem; color: #333; margin: 0.5rem 0 0 0;">Bill Pahl's Photographic Selection from the Summer 2026 Great Vilna Synagogue Excavations</p>
    </header>

    <main>
      <!--
        NOTE:
        - Replace the alt text below with concise, meaningful descriptions for each photo.
        - Add width/height attributes with the real image dimensions to avoid layout shift,
          e.g. width="1600" height="900".
        - Consider adding srcset/sizes or a <picture> element to serve responsive images.
      -->
      <figure class="photo">
        <img src="html_pics/h1.jpg" alt="Describe photo 1 here" class="heading-img" loading="lazy" decoding="async">
        <!-- <figcaption class="caption">Caption for photo 1 (optional)</figcaption> -->
      </figure>

      <figure class="photo">
        <img src="html_pics/h2.jpg" alt="Describe photo 2 here" class="heading-img" loading="lazy" decoding="async">
      </figure>

      <figure class="photo">
        <img src="html_pics/h3.jpg" alt="Describe photo 3 here" class="heading-img" loading="lazy" decoding="async">
      </figure>

      <figure class="photo">
        <img src="html_pics/h4.jpg" alt="Describe photo 4 here" class="heading-img" loading="lazy" decoding="async">
      </figure>

      <figure class="photo">
        <img src="html_pics/h5.jpg" alt="Describe photo 5 here" class="heading-img" loading="lazy" decoding="async">
      </figure>
    </main>
  </div>
</body>
</html>
